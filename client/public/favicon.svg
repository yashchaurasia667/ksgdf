<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="GridBricks Logo">
  <!-- Chassis Recessed Well Background -->
  <rect width="32" height="32" rx="4" fill="#20272b" />

  <!-- Brick Segments (2x2 Grid) -->
  <!-- Top-Left Segment (100% opacity) -->
  <rect x="3" y="3" width="11.5" height="11.5" rx="2" fill="#f15b22" />

  <!-- Top-Right Segment (80% opacity) -->
  <rect x="17.5" y="3" width="11.5" height="11.5" rx="2" fill="#f15b22" opacity="0.8" />

  <!-- Bottom-Left Segment (60% opacity) -->
  <rect x="3" y="17.5" width="11.5" height="11.5" rx="2" fill="#f15b22" opacity="0.6" />

  <!-- Bottom-Right Segment (90% opacity) -->
  <rect x="17.5" y="17.5" width="11.5" height="11.5" rx="2" fill="#f15b22" opacity="0.9" />
</svg>